  <g id="text_34">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(42.645625 310.498187)">Gyrotron data is specialist fusion evidence, not a continuous chemical-plant installation.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(42.645625 321.696)">It disproves a universal monotonic power ceiling; its efficiency excludes upstream supply and plant losses.</text>
  </g>
